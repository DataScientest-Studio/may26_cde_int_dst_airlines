  /v1/timetable:
    get:
      tags:
        - API Endpoints
      summary: Flight Schedules (Timetable).
      description: >-
        The API's timetable endpoint returns real-time flight schedules
        (departures and arrivals) for a given airport. Specify the airport IATA
        code and the schedule type (departure or arrival) you are interested in.
             *
             * **Note:** The `/timetable` and `/flightsFuture` endpoints have rate limits of 1 request every 10 seconds for Paid Plans and 1 request every 60 seconds for Free Plans, and exceeding these limits may result in throttling.
      operationId: getFlightSchedule
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: iataCode
          in: query
          description: >-
            IATA code of the airport for which the flight schedule should be
            retrieved. Example: JFK
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: >-
            The type of schedule to retrieve. Available values: departure,
            arrival
          required: true
          schema:
            type: string
            enum:
              - departure
              - arrival
        - name: limit
          in: query
          description: >-
            Specify a limit of results to return in your API response. Maximum
            allowed value is 100 below Professional Plan and 1000 on and above
            Professional Plan. Default value is 100.
          required: false
          schema:
            minimum: 1
            type: integer
            default: 100
        - name: offset
          in: query
          description: >-
            Specify an offset for pagination. Example: Specifying an offset of
            10 in combination with a limit of 10 will show results 10-20.
            Default offset value is 0, starting with the first available result.
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
        - name: status
          in: query
          description: >-
            Filter your results by flight status. Available values: landed,
            scheduled, cancelled, active, incident, diverted, redirected,
            unknown
          required: false
          schema:
            type: string
