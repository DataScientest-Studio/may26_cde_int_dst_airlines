  /v1/flightsFuture:
    get:
      tags:
        - API Endpoints
      summary: Future Flight Schedules.
      description: >-
        The API's flightsFuture endpoint returns flight schedules for a future
        date. Specify the airport IATA code, the schedule type (departure or
        arrival) and the date you are interested in.
             *
             *
        **Note:** Flight blocks within a codeshared block take precedence over
        those outside it for filtering purposes. So, if there is a flight block
        inside codeshared, then it will search the query param to match in this
        `codeshared>flight>iataNumber`. If codeshared block is not present then
        it will refer to the `flight>iataNumber`.
             *
             *
        **Note:** The `/timetable` and `/flightsFuture` endpoints have rate
        limits of 1 request every 10 seconds for Paid Plans and 1 request every
        60 seconds for Free Plans, and exceeding these limits may result in
        throttling. Also, we do not include very low-traffic airports (like CDT,
        which has around 10 or fewer flights per day) in our feeds.
      operationId: getFutureFlights
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: iataCode
          in: query
          description: >-
            IATA code of the airport for which the future flight schedule should
            be retrieved. Example: JFK
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: >-
            The type of schedule to retrieve. Available values: departure,
            arrival
          required: true
          schema:
            type: string
            enum:
              - departure
              - arrival
        - name: date
          in: query
          description: >-
            The future date for which the flight schedule should be retrieved,
            in the format YYYY-MM-DD.
          required: true
          schema:
            type: string
            format: date
        - name: airline_iata
          in: query
          description: Filter your results by airline IATA code.
          required: false
          schema:
            type: string
        - name: airline_icao
          in: query
          description: Filter your results by airline ICAO code.
          required: false
          schema:
            type: string
        - name: flight_number
          in: query
          description: Filter your results by flight number.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: >-
            Specify a limit of results to return in your API response. Maximum
            allowed value is 100 below Professional Plan and 1000 on and above
            Professional Plan. Default value is 100.
          required: false
          schema:
            minimum: 1
            type: integer
            default: 100
        - name: offset
          in: query
          description: >-
            Specify an offset for pagination. Example: Specifying an offset of
            10 in combination with a limit of 10 will show results 10-20.
            Default offset value is 0, starting with the first available result.
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
        - name: callback
          in: query
          description: >-
            Use this parameter to specify a JSONP callback function name to wrap
            your API response in.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightsFuture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'
components:
  schemas:
    ApiError:
      required:
        - error
        - success
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          required:
            - code
            - type
          type: object
          properties:
            code:
              type: integer
              description: >-
                apilayer numeric error code (the code the API returns in the
                body, e.g. 101 for an invalid access key — NOT the HTTP status).
              example: 101
            type:
              type: string
              description: Machine-readable error type.
              example: invalid_access_key
            info:
              type: string
              description: Human-readable error detail.
              example: >-
                You have not supplied a valid API Access Key. [Technical
                Support: support@apilayer.com]
      description: Standard apilayer error envelope, shared by every error response.
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    DataDeparture:
