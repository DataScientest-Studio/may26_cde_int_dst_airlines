              - landed
              - scheduled
              - cancelled
              - active
              - incident
              - diverted
              - redirected
              - unknown
        - name: airline_name
          in: query
          description: Filter your results by airline name.
          required: false
          schema:
            type: string
        - name: airline_iata
          in: query
          description: Filter your results by airline IATA code.
          required: false
          schema:
            type: string
        - name: airline_icao
          in: query
          description: Filter your results by airline ICAO code.
          required: false
          schema:
            type: string
        - name: flight_iata
          in: query
          description: Filter your results by flight IATA code.
          required: false
          schema:
            type: string
        - name: flight_icao
          in: query
          description: Filter your results by flight ICAO code.
          required: false
          schema:
            type: string
        - name: flight_num
          in: query
          description: Filter your results by flight number.
          required: false
          schema:
            type: string
        - name: dep_terminal
          in: query
          description: Filter your results by departure terminal.
          required: false
          schema:
            type: string
        - name: dep_delay
          in: query
          description: Filter your results by departure delay (minutes).
          required: false
          schema:
            minimum: 0
            type: integer
        - name: dep_schTime
          in: query
          description: Filter your results by departure scheduled time.
          required: false
          schema:
            type: string
            format: date-time
        - name: dep_estTime
          in: query
          description: Filter your results by departure estimated time.
          required: false
          schema:
            type: string
            format: date-time
        - name: dep_actTime
          in: query
          description: Filter your results by departure actual time.
          required: false
          schema:
            type: string
            format: date-time
        - name: dep_estRunway
          in: query
          description: Filter your results by departure estimated runway time.
          required: false
          schema:
            type: string
            format: date-time
        - name: dep_actRunway
          in: query
          description: Filter your results by departure actual runway time.
          required: false
          schema:
            type: string
            format: date-time
        - name: arr_terminal
          in: query
          description: Filter your results by arrival terminal.
          required: false
          schema:
            type: string
        - name: arr_delay
          in: query
          description: Filter your results by arrival delay (minutes).
          required: false
          schema:
            minimum: 0
            type: integer
        - name: arr_schTime
          in: query
          description: Filter your results by arrival scheduled time.
          required: false
          schema:
            type: string
            format: date-time
        - name: arr_estTime
          in: query
          description: Filter your results by arrival estimated time.
          required: false
          schema:
            type: string
            format: date-time
        - name: arr_actTime
          in: query
          description: Filter your results by arrival actual time.
          required: false
          schema:
            type: string
            format: date-time
        - name: arr_estRunway
          in: query
          description: Filter your results by arrival estimated runway time.
          required: false
          schema:
            type: string
            format: date-time
        - name: arr_actRunway
          in: query
          description: Filter your results by arrival actual runway time.
          required: false
          schema:
            type: string
            format: date-time
        - name: callback
          in: query
          description: >-
            Use this parameter to specify a JSONP callback function name to wrap
            your API response in.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timetable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'
