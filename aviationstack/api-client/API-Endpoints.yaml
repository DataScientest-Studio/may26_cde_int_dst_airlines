openapi: 3.0.0
info:
  title: AviationStack
  description: >-
    The aviationstack API was built to provide a simple way of accessing global
    aviation data for real-time and historical flights as well as allow
    customers to tap into an extensive data set of airline routes and other
    up-to-date aviation-related information. Requests to the REST API are made
    using a straightforward HTTP GET URL structure and responses are provided in
    lightweight JSON format. The following API documentation can be applied for
    any major programming language and will present general integration guides
    and explanations around API endpoints, request parameters and response
    objects. If any questions remain unanswered for you, simply reach out to the
    aviationstack support team for assistance.
  version: 1.0.0
servers:
  - url: https://api.aviationstack.com
    description: Production server
security:
  - ApiKeyAuth: []
tags:
  - name: API Endpoints
    description: API Endpoints
paths:
  /v1/flights:
    get:
      tags:
        - API Endpoints
      summary: Real-Time Flights and Historical Flights.
      description: |-
        # Real-Time Flights
             * The API is capable of tracking flights and retrieving flight status information in real-time. In order to look up real-time information about one or multiple flights, you can use the API's flights endpoint together with optional parameters to filter your result set.
             * # Historical Flights
             * Apart from providing data about real-time flight, the API's flights endpoint is also capable of looking up data about historical flights. In order to request data about one or more past flights, simply attach the flight_date parameter to your API request URL and set it to a date of your choice.
      operationId: getFlights
      parameters:
        - name: access_key
          in: query
          description: Your API access key, which can be found in your account dashboard.
          required: true
          schema:
            type: string
        - name: callback
          in: query
          description: >-
            Use this parameter to specify a JSONP callback function name to wrap
            your API response in.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: >-
            Specify a limit of results to return in your API response. Maximum
            allowed value is 100 below Professional Plan and 1000 on and above
            Professional Plan. Default value is 100.
          required: false
          schema:
            minimum: 1
            type: integer
            default: 100
        - name: offset
          in: query
          description: >-
            Specify an offset for pagination. Example: Specifying an offset of
            10 in combination with a limit of 10 will show results 10-20.
            Default offset value is 0, starting with the first available result.
          required: false
          schema:
            minimum: 0
            type: integer
            default: 0
        - name: flight_status
          in: query
          description: >-
            Filter your results by flight status. Available values: scheduled,
            active, landed, cancelled, incident, diverted
          required: false
          schema:
            type: string
            enum:
              - scheduled
              - active
              - landed
              - cancelled
              - incident
              - diverted
        - name: flight_date
          in: query
          description: >-
            Filter your results by providing a flight date in the format
            YYYY-MM-DD. Example: 2019-02-31
                 *
                 * **Note:** Aviationstack provides historical data for the last 12 months only.
                 *
                 * **Note:** The API response returned for historical flights is identical to the API response returned for real-time flight data. To see the API response, please jump to the Real-Time Flights section.
          required: false
          schema:
            type: string
            format: date
        - name: dep_iata
          in: query
          description: >-
            Filter your results by departure city or airport using an IATA code.
            You can retrieve IATA codes using the Airports or Cities API
            endpoints.
          required: false
          schema:
            type: string
        - name: arr_iata
          in: query
          description: >-
            Filter your results by arrival city or airport using an IATA code.
            You can retrieve IATA codes using the Airports or Cities API
            endpoints.
          required: false
          schema:
            type: string
        - name: dep_icao
          in: query
          description: >-
            Filter your results by departure airport using an ICAO code. You can
            retrieve ICAO codes using the Airports API endpoint.
          required: false
          schema:
            type: string
        - name: arr_icao
          in: query
          description: >-
            Filter your results by arrival airport using an ICAO code. You can
            retrieve ICAO codes using the Airports API endpoint.
          required: false
          schema:
            type: string
        - name: airline_name
          in: query
          description: >-
            Filter your results by airline name. You can retrieve airline names
            using the Airlines API endpoint.
          required: false
          schema:
            type: string
        - name: airline_iata
          in: query
          description: >-
            Filter your results by airline IATA code. You can retrieve airline
            IATA codes using the Airlines API endpoint.
          required: false
          schema:
            type: string
        - name: airline_icao
          in: query
          description: >-
            Filter your results by airline ICAO code. You can retrieve airline
            ICAO codes using the Airlines API endpoint.
          required: false
          schema:
            type: string
        - name: flight_number
          in: query
          description: 'Filter your results by providing a flight number. Example: 2557.'
          required: false
          schema:
            type: string
        - name: flight_iata
          in: query
          description: >-
            Filter your results by providing a flight IATA code. Example:
            MU2557.
          required: false
          schema:
            type: string
        - name: flight_icao
          in: query
          description: >-
            Filter your results by providing a flight ICAO code. Example:
            CES2557.
          required: false
          schema:
            type: string
        - name: min_delay_dep
          in: query
          description: >-
            Filter your results by providing a minimum amount of minutes in
            departure delay. Example: 7 for seven minutes of delay in departure.
          required: false
          schema:
            minimum: 0
            type: integer
        - name: min_delay_arr
          in: query
          description: >-
            Filter your results by providing a minimum amount of minutes in
            arrival delay. Example: 7 for seven minutes of delay in arrival.
          required: false
          schema:
            minimum: 0
            type: integer
        - name: max_delay_dep
          in: query
          description: >-
            Filter your results by providing a maximum amount of minutes in
            departure delay. Example: 60 for one hour of delay in departure.
          required: false
          schema:
            minimum: 0
            type: integer
        - name: max_delay_arr
          in: query
          description: >-
            Filter your results by providing a maximum amount of minutes in
            arrival delay. Example: 60 for one hour of delay in arrival.
          required: false
          schema:
            minimum: 0
            type: integer
        - name: arr_scheduled_time_arr
          in: query
          description: 'Filter your results by arrival scheduled date. [Format: YYYY-MM-DD]'
          required: false
          schema:
            type: string
            format: date
        - name: dep_scheduled_time_dep
          in: query
          description: >-
            Filter your results by departure scheduled date. [Format:
            YYYY-MM-DD]
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitReached'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'
  /v1/routes:
    get:
      tags:
        - API Endpoints
      summary: Airline Routes.
      description: >-
        The aviationstack API is capable of providing data about airline routes,
        updated every 24 hours. In order to get airline route data, use the
        API's routes endpoint along with a series of optional parameters to
        filter results.
      operationId: getRoutes
      parameters:
        - name: access_key
